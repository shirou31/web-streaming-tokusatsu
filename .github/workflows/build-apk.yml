name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Tokuflix APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/TOKUFLIX-v1.0.0.apk
          ls -lh output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOKUFLIX-Mobile-App
          path: output/TOKUFLIX-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-release
          name: TOKUFLIX Mobile App v1.0.0
          body: |
            ## 📱 TOKUFLIX Mobile App (Android APK)
            Aplikasi resmi streaming Tokusatsu Subtitle Indonesia untuk perangkat Android.

            ### ✨ Fitur Utama:
            - ⚡ 100% Gratis & Stabil
            - 🎬 Tampilan Layar Penuh (Fullscreen Player)
            - 🚀 Kualitas Resolusi hingga 1440p 2K QHD
            - 🛡️ Mendukung Kamen Rider, Super Sentai, Ultraman, dan Garo & Kaiju
            - 💾 Simpan Favorit & Riwayat Tontonan Langsung di HP

            ### 📥 Cara Pasang di Android:
            1. Unduh file `TOKUFLIX-v1.0.0.apk` di bawah ini.
            2. Buka file di HP Android Anda dan pilih **Instal**.
            3. Jika diminta izin *"Instal aplikasi yang tidak dikenal"*, izinkan untuk melanjutkan instalasi.
          files: output/TOKUFLIX-v1.0.0.apk
