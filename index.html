<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050811" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOKUFLIX" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TOKUFLIX — Portal Streaming & Nonton Tokusatsu Subtitle Indonesia</title>
    <meta name="description" content="Nonton streaming dan download serial Tokusatsu terlengkap: Kamen Rider, Super Sentai, Ultraman, dan Garo dengan Subtitle Indonesia kualitas HD/FHD." />
    <meta name="keywords" content="streaming tokusatsu, kamen rider sub indo, super sentai sub indo, ultraman sub indo, nonton tokusatsu online, tokuflix" />
    <meta name="referrer" content="no-referrer" />
    
    <!-- Google Fonts: Bricolage Grotesque, DM Sans, Plus Jakarta Sans, Chakra Petch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
    <!-- Hardware-Accelerated Video Super-Resolution & Clarity SVG Filters -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;" aria-hidden="true">
      <defs>
        <!-- 1440p (2K Ultra QHD - Convolution Matrix + Micro-Contrast Boost) -->
        <filter id="sr-filter-1440p" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
          <feConvolveMatrix
            order="3"
            kernelMatrix="0 -0.85 0 -0.85 4.4 -0.85 0 -0.85 0"
            preserveAlpha="true"
          />
          <feComponentTransfer>
            <feFuncR type="linear" slope="1.08" intercept="-0.02" />
            <feFuncG type="linear" slope="1.08" intercept="-0.02" />
            <feFuncB type="linear" slope="1.08" intercept="-0.02" />
          </feComponentTransfer>
        </filter>

        <!-- 1080p (Full HD 60FPS - Clean Edge Sharpness) -->
        <filter id="sr-filter-1080p" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
          <feConvolveMatrix
            order="3"
            kernelMatrix="0 -0.45 0 -0.45 2.8 -0.45 0 -0.45 0"
            preserveAlpha="true"
          />
          <feComponentTransfer>
            <feFuncR type="linear" slope="1.04" intercept="-0.01" />
            <feFuncG type="linear" slope="1.04" intercept="-0.01" />
            <feFuncB type="linear" slope="1.04" intercept="-0.01" />
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
