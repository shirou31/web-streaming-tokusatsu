name: Auto Update Tokusatsu Episodes (SawidagoFansub & TokuIndo Bot)

on:
  schedule:
    # Berjalan otomatis 24/7 setiap 3 jam sekali di cloud GitHub Actions (Full Automation)
    - cron: '0 */3 * * *'
  # Memungkinkan pemicuan manual atau webhook kapan saja
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    name: Check & Sync New Episodes (SawidagoFansub Bot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run SawidagoFansub Automation Bot
        run: node scripts/sawidagoBot.mjs

      - name: Run TokusatsuIndo Scanner
        run: node scripts/autoUpdateEpisodes.mjs

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/data/scrapedTokusatsu.json public/posters)" ]; then
            echo "✨ Episode baru terdeteksi oleh Sawidago Bot! Melakukan commit & push..."
            git add src/data/scrapedTokusatsu.json public/posters/
            git commit -m "🤖 SawidagoFansub Bot: auto-sync latest releases & episodes [skip ci]" || git commit -m "🤖 SawidagoFansub Bot: auto-sync latest releases & episodes"
            git push origin main
          else
            echo "✨ Tidak ada episode baru. Database sudah mutakhir dengan SawidagoFansub."
          fi

